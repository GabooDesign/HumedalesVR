<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="icon" href="favicon.png" type="favicon.png" />
    <title>Recorrido VR Web</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <!-- Componente para reproducir animaciones de modelos glTF/GLB -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <!-- Escena VR -->
    <a-scene id="sceneMain">

      <!-- Assets mínimos: coloque su archivo de audio en audio/ambience.mp3 -->
      <a-assets>
        <audio id="ambience" src="humedales_fondo.wav" preload="auto"></audio>
      </a-assets>

      <!-- Cámara VR -->
      <a-entity camera wasd-controls rotation="0 0 0" look-controls></a-entity>

      <!-- Carga modelo glb (añadido animation-mixer para reproducir animaciones incluidas) -->
      <a-entity gltf-model="Untitled.glb" id="Fondo" animation-mixer="timeScale: 0.25"></a-entity>

      <!-- Entidad de audio simple en bucle -->
      <a-sound src="#ambience" autoplay="true" loop="true" positional="false" volume="0.6"></a-sound>
    </a-scene>
  </body>
</html>
